name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows only on purpose: several fixtures in test/ hard-code Windows
        # paths (C:\Users\...), so the same suite fails on ubuntu-latest. Until
        # those fixtures are made platform-aware we run the platform they pin
        # instead of adding a job that is expected to fail.
        os: [windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # Zero dependencies (node: builtins only); lib/ is committed so that the
      # installed package does not need a build step.
      - name: Build lib/ from src/
        run: node scripts/build.mjs

      - name: lib/ matches src/
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            git status --porcelain -- lib
            echo "::error::lib/ is out of date - run npm run build and commit the result"
            exit 1
          fi

      - name: Unit tests
        run: node --test test/*.test.mjs
